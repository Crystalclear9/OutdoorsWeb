services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /app/data/app.sqlite
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请在 .env 中设置 ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
volumes:
  app-data:
