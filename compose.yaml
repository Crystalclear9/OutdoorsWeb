services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_PATH: /app/data/app.sqlite
      ADMIN_EMAIL: ${ADMIN_EMAIL:?请在 .env 中设置 ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-256}
      REQUIRE_ADMIN_MFA: ${REQUIRE_ADMIN_MFA:-true}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      ARCHIVE_AFTER_DAYS: ${ARCHIVE_AFTER_DAYS:-365}
      PUBLIC_URL: ${PUBLIC_URL:-}
      QQ_CLIENT_ID: ${QQ_CLIENT_ID:-}
      QQ_CLIENT_SECRET: ${QQ_CLIENT_SECRET:-}
      WECHAT_CLIENT_ID: ${WECHAT_CLIENT_ID:-}
      WECHAT_CLIENT_SECRET: ${WECHAT_CLIENT_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_VOICE: ${TWILIO_VOICE:-Polly.Zhiyu}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
      S3_BACKUP_ENDPOINT: ${S3_BACKUP_ENDPOINT:-}
      S3_BACKUP_REGION: ${S3_BACKUP_REGION:-us-east-1}
      S3_BACKUP_ACCESS_KEY: ${S3_BACKUP_ACCESS_KEY:-}
      S3_BACKUP_SECRET_KEY: ${S3_BACKUP_SECRET_KEY:-}
      S3_BACKUP_PREFIX: ${S3_BACKUP_PREFIX:-outdoors/}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      S3_ALLOW_HTTP: ${S3_ALLOW_HTTP:-false}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app-data:
